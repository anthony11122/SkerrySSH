name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK packages
        # The runner's bundled sdkmanager repository predates API 37 and can't resolve
        # platforms;android-37 or build-tools;37.0.0, so fetch both archives from Google's
        # SDK repo directly and unpack them where sdkmanager would.
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          install_sdk_pkg() {
            curl -fsSL "$1" -o "$RUNNER_TEMP/sdk-pkg.zip"
            rm -rf "$RUNNER_TEMP/sdk-pkg" && unzip -q "$RUNNER_TEMP/sdk-pkg.zip" -d "$RUNNER_TEMP/sdk-pkg"
            mkdir -p "$(dirname "$2")" && rm -rf "$2"
            mv "$(find "$RUNNER_TEMP/sdk-pkg" -mindepth 1 -maxdepth 1 -type d)" "$2"
          }
          install_sdk_pkg https://dl.google.com/android/repository/platform-37.0_r02.zip "$ANDROID_HOME/platforms/android-37"
          install_sdk_pkg https://dl.google.com/android/repository/build-tools_r37_linux.zip "$ANDROID_HOME/build-tools/37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install ffmpeg
        # The desktop H.264 decoder is an ffmpeg process, and the flags it drives one with were
        # arrived at empirically (see FfmpegH264DecoderTest). Its test skips itself where there is no
        # ffmpeg, so without this step a regression in those flags would go green here.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        # `allTests` as well as `test`: :shared and :composeApp are Kotlin Multiplatform modules
        # whose test tasks are named after their targets (desktopTest), so a bare `test` matched
        # nothing in them and only :server was ever tested here.
        #
        # Under xvfb-run because compose-resources asks AWT for the screen resolution when it loads
        # a string, which throws HeadlessException on a runner with no display — the failure lands
        # inside a coroutine and surfaces as a test that never reaches its final state.
        run: xvfb-run --auto-servernum ./gradlew test allTests --stacktrace

      # Static analysis. Runs after the tests so a red suite is reported first — detekt findings are
      # cheaper to read once the behaviour is known good. Existing findings sit in
      # gradle/detekt-baseline-*.xml; this step fails only on NEW ones.
      - name: Detekt
        run: ./gradlew detektAll --stacktrace

      # Gradle prints only the assertion's file and line; the values it compared live in the report.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/detekt/
          retention-days: 7

  # Windows MSI installer UI localization check: jpackage's own WiX flow cannot take an
  # overrides.wxs, so the MSI is re-packaged with --resource-dir pointing at composeApp/windows/
  # (which carries the Simplified Chinese UI strings) and the resulting MSI is grepped for
  # Chinese dialog text. Runs on every push; release.yml reuses the same recipe for the
  # published artifact.
  msi-zh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install WiX Toolset (jpackage MSI)
        run: choco install wixtoolset -y --no-progress

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Package app image
        run: ./gradlew :composeApp:createDistributable --stacktrace

      - name: Re-package MSI with Simplified Chinese UI
        shell: pwsh
        run: |
          $appImage = Get-ChildItem "composeApp/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          if (-not $appImage) { Write-Error "app image not found"; exit 1 }
          $outDir = "composeApp/build/compose/binaries/main/msi"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Get-ChildItem $outDir -Filter *.msi | Remove-Item -Force
          # jpackage finds candle/light on the PATH (the compose plugin uses the same
          # mechanism); the choco WiX install lives under "C:\Program Files (x86)\WiX Toolset v3.x".
          $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) { $env:PATH = "$($wix.FullName);$env:PATH" }
          $ver = (Select-String -Path gradle.properties -Pattern '^skerry.versionName=(.*)$').Matches.Groups[1].Value
          jpackage --type msi --app-image $appImage.FullName --name Skerry --app-version $ver --win-menu --win-shortcut --win-per-user-install --dest $outDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set MSI product language to Simplified Chinese (2052)
        # jpackage emits ProductLanguage=1033 (en-US); Windows Installer's basic UI
        # (progress/cancel/error dialogs) follows that product language, which is what makes
        # the installer look English on any system. Rewrite the Product table Language column
        # to zh-CN directly in the MSI database via Python's msilib (Windows stdlib).
        shell: pwsh
        run: |
          $msi = Get-ChildItem "composeApp/build/compose/binaries/main/msi" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "msi not found"; exit 1 }
          python -c 'import msilib,sys; db=msilib.OpenDatabase(sys.argv[1],msilib.MSIDBOPEN_DIRECT); v=db.OpenView("UPDATE `Product` SET `Language` = 2052"); v.Execute(None); db.Commit(); print("ProductLanguage -> 2052 (zh-CN)")' $msi.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify MSI product language
        shell: pwsh
        run: |
          $msi = Get-ChildItem "composeApp/build/compose/binaries/main/msi" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "msi not found"; exit 1 }
          python -c 'import msilib,sys; db=msilib.OpenDatabase(sys.argv[1],msilib.MSIDBOPEN_READONLY); v=db.OpenView("SELECT `Language` FROM `Product`"); v.Execute(None); r=v.Fetch(); lang=r.GetString(1); print("Language:", lang); sys.exit(0 if lang=="2052" else 1)' $msi.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error "MSI 语言不是 zh-CN"; exit 1 }
          Write-Host "MSI 语言验证通过: 2052 (zh-CN)"

      - name: Upload localized MSI
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skerry-msi-zh
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: ignore
